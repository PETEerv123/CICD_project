name: ESP32 test

on:
  push:
    branches: ["CICD_Pytest"]

jobs:
  test-on-hardware:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Flash
        run: |
         
          idf.py set-target esp32s3
          idf.py build
          idf.py -p /dev/ttyACM0 flash

      - name: Wait for boot
        run: sleep 5

      - name: Run pytest
        run: pytest -v -s test_v2.py
