name: ESP32 test

on:
  push:
    branches: ["CICD_Pytest"]

jobs:
  test-on-hardware:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: install tool
        shell: bash
        run: |
          chmod +x /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/tools/activate_idf_v5.5.4.sh
          chmod +x /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf/export.sh
          /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/tools/python/v5.5.4/venv/bin/python \
          /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf/tools/idf_tools.py install
      - name: Build and Flash
        shell: bash
        run: |
          . /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build
          idf.py -p /dev/ttyACM0 flash

      - name: Wait for boot
        run: sleep 5

      - name: Run pytest
        run: pytest -v -s test_v2.py
