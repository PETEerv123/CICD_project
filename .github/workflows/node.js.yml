name: ESP32 Hardware Test

on:
  push:
    branches: [ "CICD_Pytest" ]
jobs:
  test-on-hardware:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load ESP-IDF
        run: |
          source ~/esp-idf/export.sh
      - name: Clean build
        run: |
          rm -rf build
      - name: Build firmware
        run: |
          . /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Flash ESP32
        run: |
          . /mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf/export.sh
          idf.py -p /dev/ttyACM0 flash
          
      - name: Wait for boot
        run: sleep 3
        
      - name: Run pytest
        run: pytest -v -s test_v2.py
