name: ESP32 test

on:
  push:
    branches: ["CICD_Pytest"]

jobs:
  test-on-hardware:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Flash
        run: |
          export IDF_PATH=/mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif/v5.5.4/esp-idf
          export IDF_TOOLS_PATH=/mnt/hdd_WD10JPVT_1TB/p256GB/share-resource/.espressif
          
          export IDF_PYTHON_ENV_PATH=$IDF_TOOLS_PATH/tools/python/v5.5.4/venv
          export PATH=$IDF_PYTHON_ENV_PATH/bin:$PATH
          
          export PATH=$IDF_TOOLS_PATH/tools/xtensa-esp-elf/bin:$PATH
          export PATH=$IDF_TOOLS_PATH/tools/esp-clang/bin:$PATH
          export PATH=$IDF_TOOLS_PATH/tools/cmake/bin:$PATH
          export PATH=$IDF_TOOLS_PATH/tools/ninja:$PATH
          export PYTHONPATH=$IDF_PATH/tools:$IDF_PATH/tools/esp-idf-python
          
          cd $HOME/esp-idf-project/CICD_Pytest
          
          python $IDF_PATH/tools/idf.py set-target esp32s3
          python $IDF_PATH/tools/idf.py build

      - name: Wait for boot
        run: sleep 5
